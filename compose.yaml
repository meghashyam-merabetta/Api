services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_api"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
